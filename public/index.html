<!DOCTYPE html>
<html>
<head>
  <title>Arduino IoT Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px;
    }

    .card {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .value {
      font-size: 60px;
      font-weight: bold;
      color: #007bff;
      margin: 20px 0;
    }

    .status-box {
      margin: 15px auto;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .waiting {
      background: #fff3cd;
      color: #856404;
    }

    .waiting::after {
      content: "";
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0% {
        content: "";
      }

      33% {
        content: ".";
      }

      66% {
        content: "..";
      }

      100% {
        content: "...";
      }
    }

    .connected {
      background: #d4edda;
      color: #155724;
    }

    .disconnected {
      background: #f8d7da;
      color: #721c24;
    }

    button {
      margin: 8px;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .red-btn {
      background: #dc3545;
      color: white;
    }

    .green-btn {
      background: #28a745;
      color: white;
    }

    table {
      margin: 30px auto;
      border-collapse: collapse;
      width: 90%;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }

    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>ESP32 Temperature Dashboard</h1>

    <div id="arduinoStatus" class="status-box waiting">
      Waiting for Arduino
    </div>

    <p>Live Sensor Value:</p>
    <div class="value" id="sensorValue">---</div>

    <p>Last Updated:</p>
    <div id="time">Waiting...</div>

    <!-- <div id="buttons">
      <button class="red-btn led-button" onclick="controlLed('red_on')" disabled>
        Turn RED LED ON
      </button>

      <button class="red-btn led-button" onclick="controlLed('red_off')" disabled>
        Turn RED LED OFF
      </button>

      <button class="green-btn led-button" onclick="controlLed('green_on')" disabled>
        Turn GREEN LED ON
      </button>

      <button class="green-btn led-button" onclick="controlLed('green_off')" disabled>
        Turn GREEN LED OFF
      </button>
    </div> -->

    <p id="rawData">No data yet</p>
  </div>

  <h2>Latest Database Readings</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Sensor</th>
        <th>Value</th>
        <th>Raw Data</th>
        <th>Time</th>
      </tr>
    </thead>

    <tbody id="readingsTable">
      <tr>
        <td colspan="5">No readings yet</td>
      </tr>
    </tbody>
  </table>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const statusBox = document.getElementById("arduinoStatus");
    const ledButtons = document.querySelectorAll(".led-button");

    function updateArduinoStatus(connected, message) {
      statusBox.innerText = message;

      if (connected) {
        statusBox.className = "status-box connected";
        ledButtons.forEach((button) => {
          button.disabled = false;
        });
      } else {
        statusBox.className = "status-box waiting";
        ledButtons.forEach((button) => {
          button.disabled = true;
        });
      }
    }

    socket.on("arduinoStatus", (status) => {
      updateArduinoStatus(status.connected, status.message);
    });

    socket.on("sensorData", (data) => {
      document.getElementById("sensorValue").innerText = data.value;
      document.getElementById("time").innerText = data.time;
      document.getElementById("rawData").innerText = data.raw;

      loadReadings();
    });

    async function checkArduinoStatus() {
      try {
        const response = await fetch("/api/arduino/status");
        const status = await response.json();

        updateArduinoStatus(status.connected, status.message);
      } catch (error) {
        updateArduinoStatus(false, "Backend not connected");
      }
    }

    async function loadReadings() {
      try {
        const response = await fetch("/api/readings");
        const readings = await response.json();

        const table = document.getElementById("readingsTable");
        table.innerHTML = "";

        if (readings.length === 0) {
          table.innerHTML = `
            <tr>
              <td colspan="5">No readings yet</td>
            </tr>
          `;
          return;
        }

        readings.forEach((reading) => {
          const row = `
            <tr>
              <td>${reading.id}</td>
              <td>${reading.sensor_name}</td>
              <td>${reading.sensor_value}</td>
              <td>${reading.raw_data}</td>
              <td>${reading.created_at}</td>
            </tr>
          `;

          table.innerHTML += row;
        });
      } catch (error) {
        const table = document.getElementById("readingsTable");

        table.innerHTML = `
          <tr>
            <td colspan="5">Could not load readings</td>
          </tr>
        `;
      }
    }

    async function controlLed(state) {
      try {
        const response = await fetch("/api/led", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ state })
        });

        const result = await response.json();

        alert(result.message || result.error);
      } catch (error) {
        alert("Could not send command to backend");
      }
    }

    checkArduinoStatus();
    loadReadings();

    setInterval(checkArduinoStatus, 2000);
  </script>

</body>
</html>
