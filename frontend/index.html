<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mega Bench — Reading and Control Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- DARK theme (default / lights off) ---- */
    --page-bg: #0E0F13;
    --header-bg: rgba(28,31,38,0.72);
    --header-border: rgba(255,255,255,0.07);
    --header-text: #FFB627;
    --header-sub: #FFB627;
    --mark-bg: transparent;
    --mark-color: #FFB627;
    --mark-border: #8a6a23;
    --pill-bg: transparent;
    --pill-border: #2E323C;
    --pill-text: #FFB627;
    --panel-bg: rgba(28,31,38,0.72);
    --panel-border: rgba(255,255,255,0.07);
    --panel-shadow: rgba(0,0,0,0.35);
    --heading-color: #FFB627;
    --heading-rule: #2E323C;
    --value-color: #FFB627;
    --value-glow: rgba(255,182,39,0.25);
    --value-glow-flash: rgba(255,182,39,0.6);
    --unit-color: #FFB627;
    --raw-color: #FFB627;
    --trace-border: #2E323C;
    --trace-bg-1: rgba(22,24,31,0.6);
    --trace-bg-2: rgba(18,19,25,0.6);
    --trace-line: #FFB627;
    --trace-glow: rgba(255,182,39,0.5);
    --log-color: #FFB627;
    --log-border: #2E323C;
    --bulb-off-1: #3a3d45;
    --bulb-off-2: #1a1c21;
    --bulb-off-border: #34373f;
    --led-label-color: #FFB627;
    --hint-color: #FFB627;
    --hint-border: #2E323C;
    --footer-color: #FFB627;
    --scrollbar: #2E323C;
    --glow1: rgba(255,182,39,0.08);
    --glow2: rgba(95,208,104,0.06);
  }

  body.theme-bright{
    /* ---- BRIGHT theme (any light on) — deep teal + amber ---- */
    --page-bg: #0A2E2A;
    --header-bg: rgba(10,60,52,0.80);
    --header-border: rgba(95,208,150,0.18);
    --header-text: #FFB627;
    --header-sub: #FFB627;
    --mark-bg: transparent;
    --mark-color: #FFB627;
    --mark-border: #E09A10;
    --pill-bg: rgba(10,60,52,0.60);
    --pill-border: rgba(95,208,150,0.30);
    --pill-text: #FFB627;
    --panel-bg: rgba(8,46,40,0.82);
    --panel-border: rgba(95,208,150,0.14);
    --panel-shadow: rgba(0,0,0,0.40);
    --heading-color: #FFB627;
    --heading-rule: rgba(95,208,150,0.25);
    --value-color: #FFB627;
    --value-glow: rgba(255,182,39,0.28);
    --value-glow-flash: rgba(255,210,80,0.70);
    --unit-color: #FFB627;
    --raw-color: #FFB627;
    --trace-border: rgba(95,208,150,0.22);
    --trace-bg-1: rgba(8,46,40,0.70);
    --trace-bg-2: rgba(5,32,28,0.70);
    --trace-line: #FFB627;
    --trace-glow: rgba(255,182,39,0.55);
    --log-color: #FFB627;
    --log-border: rgba(95,208,150,0.20);
    --bulb-off-1: #1a4a3e;
    --bulb-off-2: #0d2e28;
    --bulb-off-border: #2e7a60;
    --led-label-color: #FFB627;
    --hint-color: #FFB627;
    --hint-border: rgba(95,208,150,0.20);
    --footer-color: #FFB627;
    --scrollbar: rgba(95,208,150,0.30);
    --glow1: rgba(95,208,150,0.10);
    --glow2: rgba(255,182,39,0.10);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--page-bg);
    color: var(--header-text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background-color .9s ease;
  }

  #bgCanvas{
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: -2;
    display: block;
  }

  .bg-glow{
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1;
    pointer-events: none;
    transition: opacity .9s ease;
  }
  .bg-glow.dark{
    background:
      radial-gradient(circle at 50% 0%, rgba(255,182,39,0.03), transparent 60%),
      radial-gradient(circle at 18% 20%, rgba(255,182,39,0.08), transparent 38%),
      radial-gradient(circle at 85% 75%, rgba(95,208,104,0.06), transparent 42%);
    opacity: 1;
  }
  .bg-glow.bright{
    background:
      radial-gradient(circle at 15% 10%, rgba(95,208,150,0.10), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(255,182,39,0.10), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(30,120,90,0.08), transparent 60%);
    opacity: 0;
  }
  body.theme-bright .bg-glow.dark{ opacity: 0; }
  body.theme-bright .bg-glow.bright{ opacity: 1; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .page{
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px;
    position: relative;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 20px;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--header-border);
    border-radius: 10px;
    margin-bottom: 18px;
    transition: background-color .9s ease, border-color .9s ease, box-shadow .9s ease;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .mark{
    font-family: 'IBM Plex Mono', monospace;
    font-weight:700;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--mark-color);
    background: var(--mark-bg);
    border: 1px solid var(--mark-border);
    border-radius: 4px;
    padding: 4px 8px;
    transition: background-color .9s ease, color .9s ease, border-color .9s ease;
  }
  .brand h1{
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    color: var(--header-text);
    transition: color .9s ease;
  }
  .brand .sub{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--header-sub);
    margin-top: 1px;
    transition: color .9s ease;
  }

  .status-pill{
    display:flex; align-items:center; gap:8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--pill-text);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--pill-border);
    background: var(--pill-bg);
    transition: background-color .9s ease, border-color .9s ease, color .9s ease;
  }
  .led-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #FF5252;
    box-shadow: 0 0 6px #FF5252;
    transition: background .3s, box-shadow .3s;
  }
  .led-dot.on{
    background: #2ECC71;
    box-shadow: 0 0 8px #2ECC71, 0 0 16px rgba(46,204,113,0.5);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }

  .grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap: 18px; }
  @media (max-width: 760px){ .grid{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: 0 10px 28px var(--panel-shadow);
    transition: background-color .9s ease, border-color .9s ease, box-shadow .9s ease;
  }
  .panel h2{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--heading-color);
    font-weight: 700;
    margin: 0 0 14px 0;
    display:flex; align-items:center; gap: 8px;
    transition: color .9s ease;
  }
  .panel h2::after{
    content:''; flex:1; height:1px;
    background: var(--heading-rule);
    opacity: 0.5;
    transition: background-color .9s ease;
  }

  .readout{ display:flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .readout .value{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 52px;
    font-weight: 700;
    color: var(--value-color);
    line-height: 1;
    text-shadow: 0 0 18px var(--value-glow);
    transition: color .9s ease, text-shadow .15s;
  }
  .readout .value.flash{ text-shadow: 0 0 30px var(--value-glow-flash); }
  .readout .unit{ font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--unit-color); transition: color .9s ease; }
  .readout .raw{ margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--raw-color); text-align: right; transition: color .9s ease; }

  canvas#trace{ width: 100%; height: 140px; display:block; }
  .trace-wrap{
    border: 1px solid var(--trace-border);
    border-radius: 8px;
    background: linear-gradient(180deg, var(--trace-bg-1), var(--trace-bg-2));
    padding: 8px;
    transition: border-color .9s ease, background-color .9s ease;
  }

  .log{
    margin-top: 16px; height: 120px; overflow-y: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--log-color);
    border-top: 1px dashed var(--log-border);
    padding-top: 10px; line-height: 1.7;
    transition: color .9s ease, border-color .9s ease;
  }
  .log .err{ color: #C62828; font-weight: 600; }
  .log .entry{ animation: logIn .25s ease; }
  @keyframes logIn{ from{ opacity: 0; transform: translateY(-3px); } to{ opacity: 1; transform: translateY(0); } }
  .log::-webkit-scrollbar{ width: 6px; }
  .log::-webkit-scrollbar-thumb{ background: var(--scrollbar); border-radius: 3px; transition: background-color .9s ease; }

  .ctrl-group{ display: flex; justify-content: space-around; gap: 16px; padding: 10px 0 4px; }

  .led-btn{
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 6px; font-family: 'Inter', sans-serif;
    color: var(--led-label-color);
    -webkit-tap-highlight-color: transparent;
  }
  .led-btn:focus-visible .bulb{ outline: 2px solid var(--value-color); outline-offset: 4px; }
  .led-btn .bulb-wrap{ position: relative; width: 64px; height: 64px; display:flex; align-items:center; justify-content:center; }
  .led-btn .halo{
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    opacity: 0; transition: opacity .3s ease; filter: blur(6px);
  }
  .led-btn.red-led .halo{ background: radial-gradient(circle, rgba(255,82,82,0.8), transparent 70%); }
  .led-btn.green-led .halo{ background: radial-gradient(circle, rgba(46,204,113,0.8), transparent 70%); }
  .led-btn.on .halo{ opacity: 1; animation: halo-breathe 2.4s ease-in-out infinite; }
  @keyframes halo-breathe{ 0%,100%{ transform: scale(1); opacity: 0.9; } 50%{ transform: scale(1.18); opacity: 0.55; } }

  .bulb{
    position: relative; width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--bulb-off-1), var(--bulb-off-2) 75%);
    border: 2px solid var(--bulb-off-border);
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.2), inset 0 3px 4px rgba(255,255,255,0.2);
    transition: background .25s, border-color .9s ease, box-shadow .25s, transform .1s;
    z-index: 1;
  }
  .led-btn:active .bulb{ transform: scale(0.92); }

  .led-btn.red-led.on .bulb{
    background: radial-gradient(circle at 35% 30%, #ffd2d2, #FF5252 55%, #C62828 100%);
    border-color: #ff8a8a;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15), 0 0 16px rgba(255,82,82,0.9), 0 0 36px rgba(255,82,82,0.55);
    animation: flicker-on .35s ease;
  }
  .led-btn.green-led.on .bulb{
    background: radial-gradient(circle at 35% 30%, #d4ffe0, #2ECC71 55%, #1B8A4A 100%);
    border-color: #7be39c;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15), 0 0 16px rgba(46,204,113,0.9), 0 0 36px rgba(46,204,113,0.55);
    animation: flicker-on .35s ease;
  }
  @keyframes flicker-on{ 0%{ opacity: 0.3; } 35%{ opacity: 1; } 50%{ opacity: 0.6; } 70%{ opacity: 1; } 100%{ opacity: 1; } }

  .led-btn .label{ font-size: 12px; font-weight: 700; letter-spacing: 0.02em; color: var(--led-label-color); transition: color .9s ease; }
  .led-btn .state{ font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--led-label-color); opacity: 0.55; }
  .led-btn.on .state{ opacity: 1; font-weight: 700; }
  .led-btn.red-led.on .state{ color: #FF5252; }
  .led-btn.green-led.on .state{ color: #2ECC71; }
  .led-btn[aria-disabled="true"]{ opacity: 0.35; cursor: not-allowed; }

  .hint{
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--hint-color);
    margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--hint-border);
    text-align: center; transition: color .9s ease, border-color .9s ease;
  }
  footer{
    text-align:center; margin-top: 18px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--footer-color); transition: color .9s ease;
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="bg-glow dark"></div>
<div class="bg-glow bright"></div>

<div class="page">

  <header>
    <div class="brand">
      <span class="mark">MEGA-2560</span>
      <div>
        <h1>Reading and Control Dashboard</h1>
        <div class="sub" id="portLabel">PORT — / —</div>
      </div>
    </div>
    <div class="status-pill">
      <span class="led-dot" id="connLed"></span>
      <span id="connText">Connecting…</span>
    </div>
  </header>

  <div class="grid">

    <section class="panel">
      <h2>Live reading</h2>
      <div class="readout">
        <span class="value" id="sensorValue">—</span>
        <span class="unit">raw units</span>
        <span class="raw" id="sensorRaw">no data yet</span>
      </div>
      <div class="trace-wrap">
        <canvas id="trace"></canvas>
      </div>
      <div class="log" id="log">
        <div class="entry">Waiting for Arduino Mega…</div>
      </div>
    </section>

    <aside class="panel">
      <h2>LED control</h2>
      <div class="ctrl-group">
        <button class="led-btn red-led" id="redSwitch" aria-pressed="false" aria-label="Toggle red LED">
          <span class="bulb-wrap"><span class="halo"></span><span class="bulb"></span></span>
          <span class="label">Red</span>
          <span class="state" id="redState">OFF</span>
        </button>
        <button class="led-btn green-led" id="greenSwitch" aria-pressed="false" aria-label="Toggle green LED">
          <span class="bulb-wrap"><span class="halo"></span><span class="bulb"></span></span>
          <span class="label">Green</span>
          <span class="state" id="greenState">OFF</span>
        </button>
      </div>
      <div class="hint" id="ctrlHint">Tap a bulb to send RED_ON / RED_OFF / GREEN_ON / GREEN_OFF over serial.</div>
    </aside>

  </div>

  <footer>socket.io live feed · polling /api/arduino/status every 3s</footer>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io("https://arduino-control-project.onrender.com");

  const connLed = document.getElementById('connLed');
  const connText = document.getElementById('connText');
  const portLabel = document.getElementById('portLabel');
  const sensorValue = document.getElementById('sensorValue');
  const sensorRaw = document.getElementById('sensorRaw');
  const log = document.getElementById('log');
  const redSwitch = document.getElementById('redSwitch');
  const greenSwitch = document.getElementById('greenSwitch');
  const redState = document.getElementById('redState');
  const greenState = document.getElementById('greenState');
  const ctrlHint = document.getElementById('ctrlHint');

  let redOn = false;
  let greenOn = false;
  let arduinoConnected = false;

  // ---- Theme switching: dark by default, bright when any LED is on ----
  const pulseColorsDark   = ['255,182,39', '95,208,104'];
  const pulseColorsBright = ['255,182,39', '95,208,150', '80,220,180'];
  const traceColorDark    = { line: '#FFB627', glow: 'rgba(255,182,39,0.5)' };
  const traceColorBright  = { line: '#FFB627', glow: 'rgba(255,182,39,0.6)'  };
  let pulseColors = pulseColorsDark;
  let traceColor  = traceColorDark;

  // Wire/dot colours per theme so they stay visible against the bg
  const wireColorsDark   = { stroke: 'rgba(255,255,255,0.18)', dot: 'rgba(255,255,255,0.25)' };
  const wireColorsBright = { stroke: 'rgba(95,208,150,0.22)',  dot: 'rgba(95,208,150,0.35)'  };
  let wireColors = wireColorsDark;

  function updateTheme(){
    const bright = redOn || greenOn;
    document.body.classList.toggle('theme-bright', bright);
    pulseColors = bright ? pulseColorsBright : pulseColorsDark;
    traceColor  = bright ? traceColorBright  : traceColorDark;
    wireColors  = bright ? wireColorsBright  : wireColorsDark;
    drawTrace();
  }

  function setConnected(connected, message){
    arduinoConnected = connected;
    connLed.classList.toggle('on', connected);
    connText.textContent = message || (connected ? 'Connected' : 'Disconnected');
    redSwitch.setAttribute('aria-disabled', String(!connected));
    greenSwitch.setAttribute('aria-disabled', String(!connected));
    ctrlHint.textContent = connected
      ? 'Tap a bulb to send RED_ON / RED_OFF / GREEN_ON / GREEN_OFF over serial.'
      : 'Arduino not connected — controls are disabled until it reconnects.';
  }

  function addLogLine(text, isError){
    const line = document.createElement('div');
    line.className = isError ? 'entry err' : 'entry';
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    while(log.children.length > 80) log.removeChild(log.firstChild);
  }

  socket.on('connect', () => { addLogLine('Browser linked to server via socket.io.'); });

  socket.on('arduinoStatus', (data) => {
    setConnected(data.connected, data.message);
    addLogLine(data.message, !data.connected);
  });

  socket.on('sensorData', (data) => {
    sensorValue.textContent = Number.isFinite(data.value) ? data.value.toString() : '—';
    sensorRaw.textContent = `${data.raw}  ·  ${data.time}`;
    sensorValue.classList.remove('flash');
    requestAnimationFrame(() => sensorValue.classList.add('flash'));
    addLogLine(`[${data.time}] ${data.raw}`);
    pushTrace(data.value);
  });

  socket.on('sensorError', (data) => {
    sensorRaw.textContent = `${data.error}  ·  ${data.time}`;
    addLogLine(`[${data.time}] ${data.sensor}: ${data.error}`, true);
  });

  async function pollStatus(){
    try{
      const res = await fetch('/api/arduino/status');
      const data = await res.json();
      portLabel.textContent = `PORT — ${data.port}`;
      setConnected(data.connected, data.message);
    }catch(e){
      connText.textContent = 'Server unreachable';
    }
  }
  pollStatus();
  setInterval(pollStatus, 3000);

  async function sendLed(state, btnEl, stateLabel, isOn){
    if(!arduinoConnected) return;
    btnEl.disabled = true;
    try{
      const res = await fetch("https://arduino-control-project.onrender.com/api/led", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state })
      });
      const data = await res.json();
      if(res.ok){
        btnEl.classList.toggle('on', isOn);
        btnEl.setAttribute('aria-pressed', String(isOn));
        stateLabel.textContent = isOn ? 'ON' : 'OFF';
        addLogLine(`Sent ${state.toUpperCase()}`);
        updateTheme();
      } else {
        addLogLine(`Command rejected: ${data.error || 'unknown error'}`, true);
      }
    }catch(e){
      addLogLine('Could not reach server to send command.', true);
    }finally{
      btnEl.disabled = false;
    }
  }

  redSwitch.addEventListener('click', () => {
    redOn = !redOn;
    sendLed(redOn ? 'red_on' : 'red_off', redSwitch, redState, redOn);
  });
  greenSwitch.addEventListener('click', () => {
    greenOn = !greenOn;
    sendLed(greenOn ? 'green_on' : 'green_off', greenSwitch, greenState, greenOn);
  });

  // ---- Oscilloscope-style sensor trace ----
  const traceCanvas = document.getElementById('trace');
  const traceCtx = traceCanvas.getContext('2d');
  let history = [];
  const MAX_POINTS = 120;

  function resizeTrace(){
    const rect = traceCanvas.getBoundingClientRect();
    traceCanvas.width = rect.width * devicePixelRatio;
    traceCanvas.height = rect.height * devicePixelRatio;
    drawTrace();
  }
  window.addEventListener('resize', resizeTrace);
  resizeTrace();

  function pushTrace(value){
    if(!Number.isFinite(value)) return;
    history.push(value);
    if(history.length > MAX_POINTS) history.shift();
    drawTrace();
  }

  function drawTrace(){
    const w = traceCanvas.width, h = traceCanvas.height;
    traceCtx.clearRect(0, 0, w, h);

    traceCtx.strokeStyle = 'rgba(120,120,120,0.08)';
    traceCtx.lineWidth = 1;
    for(let i = 1; i < 4; i++){
      const y = (h / 4) * i;
      traceCtx.beginPath();
      traceCtx.moveTo(0, y);
      traceCtx.lineTo(w, y);
      traceCtx.stroke();
    }

    if(history.length < 2) return;

    const min = Math.min(...history);
    const max = Math.max(...history);
    const range = (max - min) || 1;
    const stepX = w / (MAX_POINTS - 1);

    traceCtx.beginPath();
    traceCtx.lineWidth = 2.5 * devicePixelRatio;
    traceCtx.strokeStyle = traceColor.line;
    traceCtx.shadowColor = traceColor.glow;
    traceCtx.shadowBlur = 6;

    history.forEach((v, i) => {
      const x = i * stepX;
      const y = h - ((v - min) / range) * (h * 0.8) - (h * 0.1);
      if(i === 0) traceCtx.moveTo(x, y);
      else traceCtx.lineTo(x, y);
    });
    traceCtx.stroke();
    traceCtx.shadowBlur = 0;
  }

  // ---- Animated background: circuit traces + golden pixie dust ----
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  let wires = [];
  let pulses = [];
  let dust = [];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function buildCircuit(){
    const w = bgCanvas.width = window.innerWidth;
    const h = bgCanvas.height = window.innerHeight;
    wires = [];
    const cell = 110;
    const cols = Math.ceil(w / cell) + 1;
    const rows = Math.ceil(h / cell) + 1;

    for(let i = 0; i < cols * rows * 0.16; i++){
      const startX = Math.floor(Math.random() * cols) * cell;
      const startY = Math.floor(Math.random() * rows) * cell;
      const points = [{x: startX, y: startY}];
      const segments = 2 + Math.floor(Math.random() * 3);
      let cx = startX, cy = startY;
      for(let s = 0; s < segments; s++){
        const horizontal = Math.random() > 0.5;
        const dist = cell * (0.5 + Math.random() * 1.5);
        if(horizontal){ cx += (Math.random() > 0.5 ? dist : -dist); }
        else{ cy += (Math.random() > 0.5 ? dist : -dist); }
        points.push({x: cx, y: cy});
      }
      wires.push(points);
    }

    pulses = wires.map((wire, idx) => ({
      wireIndex: idx,
      progress: Math.random(),
      speed: 0.002 + Math.random() * 0.003,
      color: pulseColors[Math.floor(Math.random() * pulseColors.length)],
      trail: [],
      active: Math.random() > 0.2
    }));

    // golden pixie dust — floats freely, independent of the circuit grid
    const dustCount = Math.round((w * h) / 18000);
    dust = Array.from({length: dustCount}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18 - 0.04,
      r: 1 + Math.random() * 1.8,
      phase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.01 + Math.random() * 0.02
    }));
  }

  function pathLength(points){
    let len = 0;
    for(let i = 1; i < points.length; i++) len += Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
    return len;
  }

  function pointAt(points, t){
    const total = pathLength(points);
    let target = total * t;
    for(let i = 1; i < points.length; i++){
      const segLen = Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
      if(target <= segLen){
        const ratio = segLen === 0 ? 0 : target / segLen;
        return {
          x: points[i-1].x + (points[i].x - points[i-1].x) * ratio,
          y: points[i-1].y + (points[i].y - points[i-1].y) * ratio
        };
      }
      target -= segLen;
    }
    return points[points.length - 1];
  }

  function drawCircuit(){
    const w = bgCanvas.width, h = bgCanvas.height;
    // Fill with the current page background colour so the canvas matches the theme
    bgCtx.fillStyle = getComputedStyle(document.body).getPropertyValue('--page-bg').trim() || '#0E0F13';
    bgCtx.fillRect(0, 0, w, h);

    bgCtx.strokeStyle = wireColors.stroke;
    bgCtx.lineWidth = 1.3;
    wires.forEach(points => {
      bgCtx.beginPath();
      bgCtx.moveTo(points[0].x, points[0].y);
      for(let i = 1; i < points.length; i++) bgCtx.lineTo(points[i].x, points[i].y);
      bgCtx.stroke();
      points.forEach(p => {
        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        bgCtx.fillStyle = wireColors.dot;
        bgCtx.fill();
      });
    });

    pulses.forEach(p => {
      if(!p.active) return;
      const wire = wires[p.wireIndex];
      if(!wire) return;
      const pos = pointAt(wire, p.progress);

      p.trail.push({x: pos.x, y: pos.y});
      if(p.trail.length > 14) p.trail.shift();
      p.trail.forEach((pt, i) => {
        const alpha = (i / p.trail.length) * 0.5;
        const r = 2 + (i / p.trail.length) * 4;
        bgCtx.beginPath();
        bgCtx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        bgCtx.fillStyle = `rgba(${p.color},${alpha})`;
        bgCtx.fill();
      });

      const grad = bgCtx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 11);
      grad.addColorStop(0, `rgba(${p.color},1)`);
      grad.addColorStop(0.4, `rgba(${p.color},0.7)`);
      grad.addColorStop(1, `rgba(${p.color},0)`);
      bgCtx.beginPath();
      bgCtx.arc(pos.x, pos.y, 11, 0, Math.PI * 2);
      bgCtx.fillStyle = grad;
      bgCtx.fill();

      if(!reduceMotion && arduinoConnected){
        p.progress += p.speed;
        if(p.progress > 1){
          p.progress = 0;
          p.trail = [];
          p.active = Math.random() > 0.15;
          p.color = pulseColors[Math.floor(Math.random() * pulseColors.length)];
        }
      }
    });

    // golden pixie dust, drifting and twinkling, on top of the circuit
    dust.forEach(d => {
      const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(d.phase));
      const glowR = d.r * 5;
      const grad = bgCtx.createRadialGradient(d.x, d.y, 0, d.x, d.y, glowR);
      grad.addColorStop(0, `rgba(255,223,128,${0.9 * twinkle})`);
      grad.addColorStop(0.35, `rgba(255,193,7,${0.5 * twinkle})`);
      grad.addColorStop(1, 'rgba(255,193,7,0)');
      bgCtx.beginPath();
      bgCtx.arc(d.x, d.y, glowR, 0, Math.PI * 2);
      bgCtx.fillStyle = grad;
      bgCtx.fill();

      bgCtx.beginPath();
      bgCtx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      bgCtx.fillStyle = `rgba(255,250,220,${0.9 * twinkle})`;
      bgCtx.fill();

      if(!reduceMotion && arduinoConnected){
        d.x += d.vx;
        d.y += d.vy;
        d.phase += d.twinkleSpeed;
        if(d.x < -10) d.x = w + 10;
        if(d.x > w + 10) d.x = -10;
        if(d.y < -10) d.y = h + 10;
        if(d.y > h + 10) d.y = -10;
      }
    });
  }

  function animateBackground(){
    drawCircuit();
    if(!reduceMotion) requestAnimationFrame(animateBackground);
  }

  buildCircuit();
  animateBackground();
  if(reduceMotion) drawCircuit();
  window.addEventListener('resize', () => {
    buildCircuit();
    if(reduceMotion) drawCircuit();
  });
</script>
</body>
</html>
